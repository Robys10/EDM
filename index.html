<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir archivo a Catbox</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    button {
      padding: 10px 15px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #94d3a2;
    }
    #result {
      margin-top: 15px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h2>Subir archivo a Catbox.moe</h2>

  <div class="form-group">
    <input type="file" id="fileInput">
  </div>

  <button id="uploadBtn" onclick="uploadFile()">Subir archivo</button>

  <div id="result"></div>

  <script>
    const CATBOX_USERHASH = '1d51c806d2bb826e0f6bc5db8'; 

    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const resultDiv = document.getElementById('result');
      const uploadBtn = document.getElementById('uploadBtn');

      if (!fileInput.files || fileInput.files.length === 0) {
        alert('Por favor, selecciona un archivo primero.');
        return;
      }

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append('reqtype', 'fileupload');
      if (CATBOX_USERHASH) {
        formData.append('userhash', CATBOX_USERHASH);
      }
      formData.append('fileToUpload', file);

      uploadBtn.disabled = true;
      resultDiv.innerHTML = 'Subiendo archivo, por favor espera...';

      // 1. Intento directo a la API de Catbox
      try {
        const response = await fetch('https://catbox.moe/user/api.php', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          const fileUrl = await response.text();
          if (fileUrl.startsWith('https://files.catbox.moe/')) {
            resultDiv.innerHTML = `<strong>¡Archivo subido con éxito!</strong><br><a href="${fileUrl.trim()}" target="_blank">${fileUrl.trim()}</a>`;
            uploadBtn.disabled = false;
            return;
          }
        }
      } catch (e) {
        console.warn('La subida directa falló por CORS, intentando método secundario...', e);
      }

      // 2. Método alternativo si falla la petición directa
      try {
        const proxyUrl = 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent('https://catbox.moe/user/api.php');
        const response = await fetch(proxyUrl, {
          method: 'POST',
          body: formData
        });

        const resText = await response.text();
        if (response.ok && resText.includes('files.catbox.moe')) {
          resultDiv.innerHTML = `<strong>¡Archivo subido con éxito!</strong><br><a href="${resText.trim()}" target="_blank">${resText.trim()}</a>`;
        } else {
          alert('Error en la subida:\n' + resText);
          resultDiv.innerHTML = 'Error al subir el archivo.';
        }
      } catch (error) {
        console.error(error);
        alert('Error de conexión al subir el archivo: ' + error.message);
        resultDiv.innerHTML = 'Error de conexión.';
      } finally {
        uploadBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
