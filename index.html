<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Mi Playbook Multimedia</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }

    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--surface-border); gap: 16px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { font-size: 1.5rem; color: var(--primary); font-weight: 700; }
    .status-badge { background: rgba(56, 189, 248, 0.1); color: var(--primary); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; border: 1px solid rgba(56, 189, 248, 0.2); }

    .controls { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 30px; }
    
    .upload-zone { 
      background: var(--surface); 
      border: 2px dashed var(--surface-border); 
      border-radius: 16px; 
      padding: 32px 20px; 
      text-align: center; 
      cursor: pointer; 
      transition: all 0.2s ease;
    }
    .upload-zone:hover { border-color: var(--primary); background: rgba(30, 41, 59, 0.8); }
    .upload-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
    .upload-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 6px; }
    .upload-subtitle { font-size: 0.85rem; color: var(--text-muted); }
    input[type="file"] { display: none; }

    .filter-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .search-box { flex: 1; min-width: 200px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 10px; padding: 10px 16px; color: var(--text); font-size: 0.9rem; outline: none; }
    .search-box:focus { border-color: var(--primary); }

    .filter-buttons { display: flex; gap: 8px; }
    .filter-btn { background: var(--surface); border: 1px solid var(--surface-border); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); font-weight: 600; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .card { background: var(--surface); border-radius: 14px; overflow: hidden; border: 1px solid var(--surface-border); display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.3); border-color: rgba(56, 189, 248, 0.4); }
    .media-container { width: 100%; height: 210px; background: #000; overflow: hidden; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .media-container img, .media-container video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge-type { position: absolute; top: 10px; right: 10px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--primary); z-index: 2; }

    .card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
    .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; transition: color 0.2s; }
    .action-btn:hover { color: var(--primary); }
    .action-btn.delete:hover { color: var(--danger); }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { max-width: 90vw; max-height: 85vh; border-radius: 12px; overflow: hidden; position: relative; }
    .modal-content img, .modal-content video { max-width: 100%; max-height: 85vh; display: block; }
    .modal-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; z-index: 10; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span style="font-size: 1.8rem;">📂</span>
      <h1>Mi Playbook Multimedia</h1>
    </div>
    <div class="status-badge" id="status">Sincronizando...</div>
  </header>

  <div class="controls">
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
      <span class="upload-icon">☁️</span>
      <div class="upload-title">Haz clic o arrastra fotos y videos aquí</div>
      <div class="upload-subtitle">Se guardarán en tu nube y sincronizarán con tu celular</div>
      <input type="file" id="fileInput" accept="image/*,video/*" onchange="subirMultimedia(event)">
    </div>

    <div class="filter-bar">
      <input type="text" class="search-box" id="searchInput" placeholder="Buscar por nombre..." oninput="filtrarGaleria()">
      <div class="filter-buttons">
        <button class="filter-btn active" onclick="setFiltro('todos', this)">Todos</button>
        <button class="filter-btn" onclick="setFiltro('image', this)">Fotos</button>
        <button class="filter-btn" onclick="setFiltro('video', this)">Videos</button>
      </div>
    </div>
  </div>

  <div class="grid" id="galeria"></div>

  <div class="modal" id="modal" onclick="cerrarModal(event)">
    <button class="modal-close" onclick="cerrarModal(event, true)">&times;</button>
    <div class="modal-content" id="modalBody"></div>
  </div>

  <script>
    const BIN_ID = '6ab9ade8ffd5d1605335d907';
    const MASTER_KEY = '$2a$10$Hmai3/Cp0eV7AhrkxNDaHesYsuL36PJNUczcmKhTbS9QIphmrUqBy';
    const BOT_TOKEN = '8834699870:AAH_zRhDKnehSxKLKX85fcnle-osHOdvTPc';
    const CHAT_ID = '8616807953';

    let items = [];
    let filtroActual = 'todos';

    document.addEventListener('DOMContentLoaded', cargarDesdeNube);

    async function cargarDesdeNube() {
      const status = document.getElementById('status');
      status.innerText = "Sincronizando con la nube...";
      status.style.color = "#38bdf8";

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': MASTER_KEY }
        });
        if (!res.ok) throw new Error('Error al conectar con la base de datos');
        const data = await res.json();
        
        if (Array.isArray(data.record)) {
          items = data.record;
        } else if (data.record && Array.isArray(data.record.items)) {
          items = data.record.items;
        } else {
          items = [];
        }

        renderGaleria();
        status.innerText = "Sincronizado al instante";
        status.style.color = "#4ade80";
      } catch (err) {
        console.error(err);
        status.innerText = "Error de sincronización";
        status.style.color = "#ef4444";
      }
    }

    async function subirMultimedia(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('status');
      status.innerText = "Subiendo archivo a Telegram...";
      status.style.color = "#38bdf8";

      try {
        const esVideo = file.type.startsWith('video/') || file.name.match(/\.(mp4|webm|mov|avi)$/i);
        const endpoint = esVideo ? 'sendVideo' : 'sendPhoto';
        const fieldName = esVideo ? 'video' : 'photo';

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append(fieldName, file);

        const tgRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${endpoint}`, {
          method: 'POST',
          body: formData
        });

        const tgData = await tgRes.json();
        if (!tgData.ok) throw new Error(tgData.description || 'Error al enviar a Telegram');

        let fileId = '';
        if (esVideo) {
          fileId = tgData.result.video.file_id;
        } else {
          const photos = tgData.result.photo;
          fileId = photos[photos.length - 1].file_id;
        }

        const fileInfoRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
        const fileInfoData = await fileInfoRes.json();
        
        if (!fileInfoData.ok) throw new Error('Error al obtener la ruta del archivo');
        const filePath = fileInfoData.result.file_path;
        
        const fileUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${filePath}`;

        const nuevoElemento = {
          url: fileUrl,
          name: file.name,
          type: esVideo ? 'video/mp4' : 'image/jpeg',
          date: new Date().toISOString()
        };

        items.unshift(nuevoElemento);

        status.innerText = "Guardando en tu base de datos...";

        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': MASTER_KEY
          },
          body: JSON.stringify({ items: items })
        });

        status.innerText = "¡Subido y sincronizado!";
        status.style.color = "#4ade80";
        renderGaleria();

      } catch (err) {
        console.error(err);
        alert('Ocurrió un error al procesar o subir el archivo: ' + err.message);
        status.innerText = "Error en la subida";
        status.style.color = "#ef4444";
      }
    }

    async function eliminarItem(index) {
      if (!confirm('¿Seguro que deseas eliminar este archivo? Se borrará de todos tus dispositivos.')) return;

      items.splice(index, 1);

      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': MASTER_KEY
          },
          body: JSON.stringify({ items: items })
        });
        renderGaleria();
      } catch (e) {
        alert('Error al actualizar en la nube.');
      }
    }

    function renderGaleria() {
      const galeria = document.getElementById('galeria');
      const busqueda = document.getElementById('searchInput').value.toLowerCase();
      galeria.innerHTML = '';

      let itemsFiltrados = items.filter(item => {
        const coincideTipo = filtroActual === 'todos' || (item.type && item.type.startsWith(filtroActual));
        const coincideNombre = item.name.toLowerCase().includes(busqueda);
        return coincideTipo && coincideNombre;
      });

      if (itemsFiltrados.length === 0) {
        galeria.innerHTML = `
          <div class="empty-state">
            <p style="font-size: 2rem; margin-bottom: 10px;">🎨</p>
            <p>No hay fotos o videos en tu galería sincronizada.</p>
          </div>
        `;
        return;
      }

      itemsFiltrados.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';

        const esImagen = item.type && item.type.startsWith('image/');
        const tipoTexto = esImagen ? 'FOTO' : 'VIDEO';

        let mediaHtml = esImagen 
          ? `<img src="${item.url}" alt="${item.name}" loading="lazy">`
          : `<video src="${item.url}" controls preload="metadata"></video>`;

        card.innerHTML = `
          <div class="media-container" onclick="abrirModal('${item.url}', '${item.type}')">
            <span class="badge-type">${tipoTexto}</span>
            ${mediaHtml}
          </div>
          <div class="card-body">
            <div class="card-title" title="${item.name}">${item.name}</div>
            <div class="card-actions">
              <button class="action-btn" onclick="copiarEnlace('${item.url}')">🔗 Copiar Link</button>
              <button class="action-btn delete" onclick="eliminarItem(${index})">🗑️ Eliminar</button>
            </div>
          </div>
        `;
        galeria.appendChild(card);
      });
    }

    function setFiltro(tipo, btn) {
      filtroActual = tipo;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGaleria();
    }

    function filtrarGaleria() {
      renderGaleria();
    }

    function copiarEnlace(url) {
      navigator.clipboard.writeText(url);
      alert('¡Enlace de reproductor copiado!');
    }

    function abrirModal(url, type) {
      const modal = document.getElementById('modal');
      const modalBody = document.getElementById('modalBody');

      if (type && type.startsWith('image/')) {
        modalBody.innerHTML = `<img src="${url}" alt="Vista previa">`;
      } else {
        modalBody.innerHTML = `<video src="${url}" controls autoplay></video>`;
      }

      modal.classList.add('active');
    }

    function cerrarModal(e, force = false) {
      if (force || e.target.id === 'modal') {
        const modal = document.getElementById('modal');
        const modalBody = document.getElementById('modalBody');
        modal.classList.remove('active');
        modalBody.innerHTML = '';
      }
    }
  </script>
</body>
</html>
