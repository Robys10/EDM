<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Playbook Multimedia Pro</title>
  <style>
    :root {
      --bg: #090d16;
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b 0%, #090d16 70%);
      --surface: #131c2e;
      --surface-card: #1a263d;
      --surface-border: #2a3a58;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --primary-hover: #0284c7;
      --accent: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #f43f5e;
      --success: #34d399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    
    body { 
      background: var(--bg-gradient); 
      color: var(--text); 
      padding: 24px; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 1200px;
    }

    header { 
      display: flex; 
      flex-wrap: wrap; 
      justify-content: space-between; 
      align-items: center; 
      padding: 16px 24px; 
      background: rgba(19, 28, 46, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      gap: 16px; 
      margin-bottom: 24px; 
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-icon {
      font-size: 1.8rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand h1 { font-size: 1.4rem; color: var(--text); font-weight: 800; letter-spacing: -0.02em; }

    .status-badge { 
      background: rgba(56, 189, 248, 0.1); 
      color: var(--primary); 
      padding: 6px 16px; 
      border-radius: 99px; 
      font-size: 0.85rem; 
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.25);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }

    .sync-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .sync-header { font-size: 0.95rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .sync-inputs { display: flex; gap: 12px; flex-wrap: wrap; }
    .sync-inputs input { 
      flex: 1; 
      min-width: 240px; 
      background: rgba(9, 13, 22, 0.6); 
      border: 1px solid var(--surface-border); 
      padding: 10px 14px; 
      border-radius: 10px; 
      color: var(--text); 
      font-size: 0.85rem; 
      outline: none;
      transition: border-color 0.2s;
    }
    .sync-inputs input:focus { border-color: var(--primary); }
    .btn-sync { 
      background: var(--primary); 
      color: #090d16; 
      font-weight: 700; 
      border: none; 
      padding: 10px 20px; 
      border-radius: 10px; 
      cursor: pointer; 
      transition: all 0.2s;
    }
    .btn-sync:hover { background: var(--primary-hover); box-shadow: 0 0 15px var(--primary-glow); }

    .controls { display: grid; grid-template-columns: 1fr; gap: 24px; margin-bottom: 32px; }
    
    .upload-zone { 
      background: linear-gradient(180deg, rgba(26, 38, 61, 0.5) 0%, rgba(19, 28, 46, 0.5) 100%); 
      border: 2px dashed var(--surface-border); 
      border-radius: 20px; 
      padding: 36px 20px; 
      text-align: center; 
      cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .upload-zone:hover { 
      border-color: var(--primary); 
      background: rgba(26, 38, 61, 0.8);
      box-shadow: 0 0 30px var(--primary-glow);
      transform: translateY(-2px);
    }
    .upload-icon { font-size: 2.8rem; margin-bottom: 10px; display: inline-block; transition: transform 0.3s; }
    .upload-zone:hover .upload-icon { transform: scale(1.1) translateY(-4px); }
    .upload-title { font-weight: 700; font-size: 1.15rem; margin-bottom: 4px; color: var(--text); }
    .upload-subtitle { font-size: 0.85rem; color: var(--text-muted); }
    input[type="file"] { display: none; }

    .filter-bar { 
      display: flex; 
      flex-wrap: wrap; 
      justify-content: space-between; 
      align-items: center; 
      gap: 16px; 
      background: var(--surface);
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid var(--surface-border);
    }
    .search-box { 
      flex: 1; 
      min-width: 220px; 
      background: rgba(9, 13, 22, 0.6); 
      border: 1px solid var(--surface-border); 
      border-radius: 10px; 
      padding: 10px 16px; 
      color: var(--text); 
      font-size: 0.9rem; 
      outline: none; 
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: var(--primary); }

    .filter-buttons { display: flex; gap: 8px; }
    .filter-btn { 
      background: rgba(9, 13, 22, 0.6); 
      border: 1px solid var(--surface-border); 
      color: var(--text-muted); 
      padding: 8px 18px; 
      border-radius: 10px; 
      font-size: 0.85rem; 
      font-weight: 600;
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .filter-btn.active, .filter-btn:hover { 
      background: var(--primary); 
      color: #090d16; 
      border-color: var(--primary); 
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
      gap: 24px; 
    }
    .card { 
      background: var(--surface-card); 
      border-radius: 18px; 
      overflow: hidden; 
      border: 1px solid var(--surface-border); 
      display: flex; 
      flex-direction: column; 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      position: relative; 
    }
    .card:hover { 
      transform: translateY(-6px); 
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4); 
      border-color: rgba(56, 189, 248, 0.5); 
    }
    .media-container { 
      width: 100%; 
      height: 220px; 
      background: #000; 
      overflow: hidden; 
      position: relative; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .media-container img, .media-container video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      display: block; 
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .media-container:hover .play-overlay { opacity: 1; }
    .play-icon {
      width: 48px;
      height: 48px;
      background: rgba(56, 189, 248, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 1.2rem;
      padding-left: 3px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .badge-type { 
      position: absolute; 
      top: 12px; 
      right: 12px; 
      background: rgba(9, 13, 22, 0.75); 
      backdrop-filter: blur(6px); 
      padding: 4px 10px; 
      border-radius: 8px; 
      font-size: 0.7rem; 
      text-transform: uppercase; 
      font-weight: 800; 
      letter-spacing: 0.05em;
      color: var(--primary); 
      z-index: 2; 
      border: 1px solid rgba(255,255,255,0.1);
    }

    .card-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .card-title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); }
    .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
    .action-btn:hover { color: var(--primary); }
    .action-btn.delete:hover { color: var(--danger); }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 1000; justify-content: center; align-items: center; padding: 24px; }
    .modal.active { display: flex; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-content { max-width: 90vw; max-height: 85vh; border-radius: 16px; overflow: hidden; position: relative; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); border: 1px solid var(--surface-border); background: #000; }
    .modal-content img { max-width: 90vw; max-height: 85vh; object-fit: contain; display: block; }
    .modal-content video { max-width: 90vw; max-height: 85vh; display: block; outline: none; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: white; width: 38px; height: 38px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .modal-close:hover { background: var(--danger); }

    .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); grid-column: 1 / -1; }
    .empty-state-icon { font-size: 3.5rem; margin-bottom: 16px; display: block; opacity: 0.6; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand">
        <span class="brand-icon">✦</span>
        <h1>Mi Playbook Multimedia Pro</h1>
      </div>
      <div class="status-badge" id="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Configuración Requerida</span>
      </div>
    </header>

    <div class="sync-card">
      <div class="sync-header">⚙️ Conexión de Sincronización (PC / Celular)</div>
      <div class="sync-inputs">
        <input type="text" id="binId" placeholder="BIN ID (Ej. 6ab9ade8ffd5d1605335d907)">
        <input type="password" id="apiKey" placeholder="Master Key ($2a$10$...)">
        <button class="btn-sync" onclick="guardarCredenciales()">Conectar y Cargar</button>
      </div>
    </div>

    <div class="controls">
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <span class="upload-icon">☁️</span>
        <div class="upload-title">Haz clic o arrastra fotos y videos aquí</div>
        <div class="upload-subtitle">Se subirán a la nube y aparecerán instantáneamente en tu celular</div>
        <input type="file" id="fileInput" accept="image/*,video/*" multiple onchange="subirMultimedia(event)">
      </div>

      <div class="filter-bar">
        <input type="text" class="search-box" id="searchInput" placeholder="Buscar por nombre..." oninput="filtrarGaleria()">
        <div class="filter-buttons">
          <button class="filter-btn active" onclick="setFiltro('todos', this)">Todos</button>
          <button class="filter-btn" onclick="setFiltro('image', this)">Fotos</button>
          <button class="filter-btn" onclick="setFiltro('video', this)">Videos</button>
        </div>
      </div>
    </div>

    <div class="grid" id="galeria"></div>
  </div>

  <div class="modal" id="modal" onclick="cerrarModal(event)">
    <button class="modal-close" onclick="cerrarModal(event, true)">&times;</button>
    <div class="modal-content" id="modalBody"></div>
  </div>

  <script>
    let filtroActual = 'todos';
    let mediaItems = [];

    document.addEventListener('DOMContentLoaded', () => {
      const savedBin = localStorage.getItem('jb_bin_id') || '';
      const savedKey = localStorage.getItem('jb_api_key') || '';
      
      document.getElementById('binId').value = savedBin;
      document.getElementById('apiKey').value = savedKey;

      if (savedBin && savedKey) {
        cargarDesdeNube();
      } else {
        renderGaleria();
      }
    });

    function actualizarEstado(texto, exito = true) {
      const statusText = document.getElementById('statusText');
      const statusDot = document.getElementById('statusDot');
      
      statusText.innerText = texto;
      statusDot.style.background = exito ? 'var(--success)' : 'var(--danger)';
      statusDot.style.boxShadow = exito ? '0 0 8px var(--success)' : '0 0 8px var(--danger)';
    }

    function guardarCredenciales() {
      const binId = document.getElementById('binId').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();

      if (!binId || !apiKey) {
        alert('Por favor ingresa tanto el BIN ID como el Master Key.');
        return;
      }

      localStorage.setItem('jb_bin_id', binId);
      localStorage.setItem('jb_api_key', apiKey);
      cargarDesdeNube();
    }

    async function cargarDesdeNube() {
      const binId = localStorage.getItem('jb_bin_id');
      const apiKey = localStorage.getItem('jb_api_key');

      if (!binId || !apiKey) return;

      actualizarEstado("Sincronizando...", true);

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
          headers: { 'X-Master-Key': apiKey }
        });

        if (!res.ok) throw new Error('Error al cargar datos');

        const data = await res.json();
        // Garantizar lectura adecuada de la estructura {"items": [...]}
        if (data.record && Array.isArray(data.record.items)) {
          mediaItems = data.record.items;
        } else if (Array.isArray(data.record)) {
          mediaItems = data.record;
        } else {
          mediaItems = [];
        }

        actualizarEstado("Sincronizado", true);
        renderGaleria();
      } catch (err) {
        actualizarEstado("Error de Conexión", false);
      }
    }

    async function subirMultimedia(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      const binId = localStorage.getItem('jb_bin_id');
      const apiKey = localStorage.getItem('jb_api_key');

      if (!binId || !apiKey) {
        alert('Ingresa y guarda tu BIN ID y Master Key primero.');
        return;
      }

      actualizarEstado("Subiendo archivos...", true);

      for (const file of files) {
        try {
          const formData = new FormData();
          formData.append('reqtype', 'fileupload');
          formData.append('fileToUpload', file);

          const uploadRes = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://catbox.moe/user/api.php'), {
            method: 'POST',
            body: formData
          });

          if (!uploadRes.ok) throw new Error('Falló subida');

          const fileUrl = (await uploadRes.text()).trim();

          const nuevoItem = {
            id: Date.now() + Math.random().toString(36).substr(2, 5),
            url: fileUrl,
            name: file.name,
            type: file.type || (file.name.match(/\.(mp4|webm|mov|avi)$/i) ? 'video/mp4' : 'image/jpeg'),
            timestamp: Date.now()
          };

          mediaItems.unshift(nuevoItem);
        } catch (err) {
          console.error("Error al subir:", file.name, err);
        }
      }

      // Guardar lista actualizada respetando la estructura {"items": [...]}
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': apiKey
          },
          body: JSON.stringify({ items: mediaItems })
        });

        actualizarEstado("Sincronizado", true);
        renderGaleria();
      } catch (err) {
        actualizarEstado("Error al guardar en nube", false);
      }

      event.target.value = '';
    }

    async function eliminarItem(id, event) {
      event.stopPropagation();
      if (!confirm('¿Eliminar este elemento de la nube?')) return;

      const binId = localStorage.getItem('jb_bin_id');
      const apiKey = localStorage.getItem('jb_api_key');

      mediaItems = mediaItems.filter(i => i.id !== id);

      try {
        await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': apiKey
          },
          body: JSON.stringify({ items: mediaItems })
        });
        renderGaleria();
      } catch (err) {
        alert('Error al eliminar el elemento.');
      }
    }

    function renderGaleria() {
      const galeria = document.getElementById('galeria');
      const busqueda = document.getElementById('searchInput').value.toLowerCase();
      galeria.innerHTML = '';

      let itemsFiltrados = mediaItems.filter(item => {
        const coincideTipo = filtroActual === 'todos' || (item.type && item.type.startsWith(filtroActual));
        const coincideNombre = item.name ? item.name.toLowerCase().includes(busqueda) : true;
        return coincideTipo && coincideNombre;
      });

      if (itemsFiltrados.length === 0) {
        galeria.innerHTML = `
          <div class="empty-state">
            <span class="empty-state-icon">🖼️</span>
            <p style="font-size: 1.1rem; font-weight: 600; color: var(--text);">No hay multimedia disponible</p>
            <p style="font-size: 0.85rem; margin-top: 4px;">Sube fotos o videos o verifica tus credenciales.</p>
          </div>
        `;
        return;
      }

      itemsFiltrados.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const esImagen = item.type && item.type.startsWith('image/');
        const tipoTexto = esImagen ? 'FOTO' : 'VIDEO';

        let mediaHtml = esImagen 
          ? `<img src="${item.url}" alt="${item.name}">`
          : `<video src="${item.url}#t=0.1" preload="metadata"></video>
             <div class="play-overlay"><div class="play-icon">▶</div></div>`;

        card.innerHTML = `
          <div class="media-container" onclick="abrirModal('${item.id}')">
            <span class="badge-type">${tipoTexto}</span>
            ${mediaHtml}
          </div>
          <div class="card-body">
            <div class="card-title" title="${item.name}">${item.name || 'Sin título'}</div>
            <div class="card-actions">
              <button class="action-btn" onclick="abrirModal('${item.id}')">🔍 Vista Previa</button>
              <button class="action-btn delete" onclick="eliminarItem('${item.id}', event)">🗑️ Eliminar</button>
            </div>
          </div>
        `;
        galeria.appendChild(card);
      });
    }

    function setFiltro(tipo, btn) {
      filtroActual = tipo;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGaleria();
    }

    function filtrarGaleria() {
      renderGaleria();
    }

    function abrirModal(id) {
      const item = mediaItems.find(i => i.id === id);
      if (!item) return;

      const modal = document.getElementById('modal');
      const modalBody = document.getElementById('modalBody');

      if (item.type && item.type.startsWith('image/')) {
        modalBody.innerHTML = `<img src="${item.url}" alt="${item.name}">`;
      } else {
        modalBody.innerHTML = `<video src="${item.url}" controls autoplay preload="auto"></video>`;
      }

      modal.classList.add('active');
    }

    function cerrarModal(e, force = false) {
      if (force || e.target.id === 'modal') {
        const modal = document.getElementById('modal');
        const modalBody = document.getElementById('modalBody');
        
        const video = modalBody.querySelector('video');
        if (video) video.pause();

        modal.classList.remove('active');
        modalBody.innerHTML = '';
      }
    }
  </script>
</body>
</html>
