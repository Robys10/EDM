<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Multimedia Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-photo-film text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Galería Local</h1>
                    <p class="text-xs text-slate-400" id="storage-status">Almacenamiento Local (IndexedDB)</p>
                </div>
            </div>

            <!-- Botones de Acción principales -->
            <div class="flex items-center gap-3">
                <label for="file-input" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg cursor-pointer transition flex items-center gap-2 text-sm shadow-md">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Subir Archivos</span>
                </label>
                <input type="file" id="file-input" multiple accept="image/*,video/*" class="hidden">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- Barra de herramientas (Filtros y Búsqueda) -->
        <div class="flex flex-wrap justify-between items-center gap-4 mb-8 bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
            <!-- Filtros -->
            <div class="flex items-center gap-2">
                <button onclick="setFilter('all')" id="btn-filter-all" class="filter-btn active px-3 py-1.5 rounded-lg text-sm font-medium transition bg-indigo-600 text-white">
                    Todos
                </button>
                <button onclick="setFilter('image')" id="btn-filter-image" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium transition bg-slate-700 hover:bg-slate-600 text-slate-300">
                    <i class="fa-regular fa-image mr-1"></i> Fotos
                </button>
                <button onclick="setFilter('video')" id="btn-filter-video" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium transition bg-slate-700 hover:bg-slate-600 text-slate-300">
                    <i class="fa-solid fa-video mr-1"></i> Videos
                </button>
            </div>

            <!-- Contador de elementos -->
            <div class="text-sm text-slate-400">
                Total: <span id="item-count" class="font-bold text-slate-200">0</span> elementos
            </div>
        </div>

        <!-- Estado Vacío -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="bg-slate-800 p-6 rounded-full text-slate-500 mb-4 border border-slate-700">
                <i class="fa-regular fa-folder-open text-5xl"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-300">No hay archivos en tu galería</h3>
            <p class="text-slate-500 text-sm max-w-sm mt-1">Sube imágenes o videos utilizando el botón superior. Se guardarán localmente en tu navegador.</p>
        </div>

        <!-- Grid de Galería -->
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Las tarjetas de archivos se insertarán dinámicamente aquí -->
        </div>
    </main>

    <!-- Modal para Visualización Fullscreen -->
    <div id="media-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex-col justify-between p-4 backdrop-blur-sm">
        <div class="flex justify-between items-center text-white px-4 py-2">
            <span id="modal-filename" class="text-sm font-medium truncate max-w-md text-slate-300"></span>
            <button onclick="closeModal()" class="text-slate-400 hover:text-white p-2 rounded-lg transition text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <div class="flex-1 flex items-center justify-center overflow-hidden my-2" id="modal-content">
            <!-- El contenido multimedia se inyectará aquí -->
        </div>

        <div class="flex justify-center gap-4 py-2">
            <button id="modal-delete-btn" class="bg-rose-600/80 hover:bg-rose-600 text-white px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
                <i class="fa-solid fa-trash"></i> Eliminar
            </button>
        </div>
    </div>

    <!-- Script principal con IndexedDB -->
    <script>
        const DB_NAME = 'LocalGalleryDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'media';

        let db = null;
        let currentFilter = 'all';
        let mediaItems = [];
        let activeModalId = null;

        // Inicializar IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };

                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };

                request.onerror = (e) => {
                    console.error('Error al abrir IndexedDB:', e.target.error);
                    reject(e.target.error);
                };
            });
        }

        // Cargar todos los archivos guardados en IndexedDB
        async function loadMedia() {
            if (!db) await initDB();

            const transaction = db.transaction(STORE_NAME, 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.getAll();

            request.onsuccess = () => {
                // Convertir Blob/File a Object URLs para mostrarlos en el HTML
                mediaItems = request.result.map(item => ({
                    ...item,
                    url: URL.revokeObjectURL(item.url) || URL.createObjectURL(item.file)
                }));
                renderGallery();
            };
        }

        // Guardar archivo nuevo
        async function saveMediaFiles(files) {
            if (!db) await initDB();

            const transaction = db.transaction(STORE_NAME, 'readwrite');
            const store = transaction.objectStore(STORE_NAME);

            Array.from(files).forEach(file => {
                const isImage = file.type.startsWith('image/');
                const isVideo = file.type.startsWith('video/');

                if (isImage || isVideo) {
                    const newItem = {
                        id: 'media_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                        name: file.name,
                        type: isImage ? 'image' : 'video',
                        file: file, // Guardamos el Blob/File completo en IndexedDB
                        dateAdded: new Date().toISOString()
                    };

                    store.add(newItem);
                }
            });

            transaction.oncomplete = () => {
                loadMedia();
            };
        }

        // Eliminar elemento de IndexedDB
        async function deleteMedia(id) {
            if (!db) await initDB();

            const transaction = db.transaction(STORE_NAME, 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            store.delete(id);

            transaction.oncomplete = () => {
                closeModal();
                loadMedia();
            };
        }

        // Renderizar la Galería
        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            const emptyState = document.getElementById('empty-state');
            const itemCount = document.getElementById('item-count');

            const filteredItems = mediaItems.filter(item => {
                if (currentFilter === 'all') return true;
                return item.type === currentFilter;
            });

            itemCount.textContent = filteredItems.length;

            if (filteredItems.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            grid.innerHTML = filteredItems.map(item => `
                <div class="group bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-lg hover:border-indigo-500/50 transition cursor-pointer flex flex-col" onclick="openModal('${item.id}')">
                    <div class="relative aspect-video bg-slate-950 flex items-center justify-center overflow-hidden">
                        ${item.type === 'image' 
                            ? `<img src="${item.url}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">`
                            : `<video src="${item.url}" class="w-full h-full object-cover"></video>
                               <div class="absolute inset-0 bg-black/40 flex items-center justify-center group-hover:bg-black/20 transition">
                                   <div class="w-12 h-12 rounded-full bg-indigo-600/90 text-white flex items-center justify-center pl-1 shadow-lg">
                                       <i class="fa-solid fa-play"></i>
                                   </div>
                               </div>`
                        }
                        <span class="absolute top-2 right-2 px-2 py-1 bg-slate-900/80 backdrop-blur-md rounded text-[10px] uppercase font-bold text-slate-300">
                            ${item.type}
                        </span>
                    </div>
                    <div class="p-3 flex justify-between items-center gap-2">
                        <p class="text-xs font-medium text-slate-300 truncate">${item.name}</p>
                        <button onclick="event.stopPropagation(); deleteMedia('${item.id}')" class="text-slate-500 hover:text-rose-400 p-1 transition" title="Eliminar">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Filtros
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-slate-700', 'text-slate-300');
            });
            const activeBtn = document.getElementById(`btn-filter-${filter}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-700', 'text-slate-300');
                activeBtn.classList.add('bg-indigo-600', 'text-white');
            }
            renderGallery();
        }

        // Modal Handlers
        function openModal(id) {
            const item = mediaItems.find(i => i.id === id);
            if (!item) return;

            activeModalId = id;
            const modal = document.getElementById('media-modal');
            const modalContent = document.getElementById('modal-content');
            const modalFilename = document.getElementById('modal-filename');
            const deleteBtn = document.getElementById('modal-delete-btn');

            modalFilename.textContent = item.name;
            deleteBtn.onclick = () => deleteMedia(item.id);

            if (item.type === 'image') {
                modalContent.innerHTML = `<img src="${item.url}" class="max-h-full max-w-full object-contain rounded-lg">`;
            } else {
                modalContent.innerHTML = `<video src="${item.url}" controls autoplay class="max-h-full max-w-full rounded-lg"></video>`;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('media-modal');
            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = '';
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            activeModalId = null;
        }

        // Listeners
        document.getElementById('file-input').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                saveMediaFiles(e.target.files);
                e.target.value = ''; // Reset input
            }
        });

        // Inicializar aplicación
        window.addEventListener('DOMContentLoaded', () => {
            initDB().then(() => loadMedia());
        });
    </script>
</body>
</html>
